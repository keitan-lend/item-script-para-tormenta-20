<div class="item-script-editor">
  <div class="form-group">
    <label for="script-textarea">Script:</label>
    <textarea
      id="script-textarea"
      name="script"
      rows="14"
      spellcheck="false"
    >{{script}}</textarea>
  </div>
  <footer class="item-script-editor-footer">
    <button type="button" data-action="save">
      <i class="fas fa-save"></i> Salvar
    </button>
  </footer>
</div>
