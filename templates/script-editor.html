<form class="item-script-editor">
  <div class="form-group">
    <label>Script:</label>
    <div class="form-fields">
      <textarea name="script" rows="12" style="width: 100%; font-family: monospace;">{{script}}</textarea>
    </div>
  </div>
  <footer class="sheet-footer flexrow">
    <button type="button" data-action="save">
      <i class="fas fa-save"></i> Salvar
    </button>
  </footer>
</form>
